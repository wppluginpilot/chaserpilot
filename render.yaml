# ChaserPilot on Render (free web service) with its database on Neon (free).
#
# After the first deploy, set SHOPIFY_API_KEY, SHOPIFY_API_SECRET and
# SHOPIFY_APP_URL (this service's https:// URL). The app refuses to boot in
# production without them, so the first deploy failing is expected.
services:
  - type: web
    name: chaserpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon free Postgres (never expires). Set by hand in the dashboard;
      # use the direct (non-pooled) connection string with sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      # Comma-separated dev-store domains allowed to bypass billing while unlisted. Leave unset for review/production.
      - key: BILLING_WAIVER_SHOPS
        sync: false
      - key: LOG_LEVEL
        value: info
      # Daily digest email. Render's free web service blocks outbound SMTP, so use
      # resend or brevo (HTTPS). Leave MAIL_PROVIDER unset or "none" for the in-app
      # Today digest only.
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

